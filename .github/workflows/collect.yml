name: Spritpreise stündlich

on:
  schedule:
    - cron: "4 * * * *"     # jede Stunde zur Minute 4 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Preise abrufen
        env: { TK_API_KEY: "${{ secrets.TK_API_KEY }}" }
        run: python scripts/collect.py
      - name: Dashboard-Daten bauen
        run: python scripts/build_summary.py
      - name: Committen
        run: |
          git config user.name "diesel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data.json docs/latest.json
          git diff --cached --quiet || git commit -m "Preise $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M')"
          git pull --rebase && git push
