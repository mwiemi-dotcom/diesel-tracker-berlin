name: Spritpreise stündlich

on:
  schedule:
    - cron: "23 * * * *"    # jede Stunde zur Minute 23 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TK_API_KEY: "${{ secrets.TK_API_KEY }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Preise abrufen
        run: python scripts/collect.py
      - name: Dashboard-Daten bauen
        run: python scripts/build_summary.py
      - name: Committen (bei Konflikt neu abrufen)
        run: |
          git config user.name "diesel-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git add data docs/data.json docs/latest.json
            git diff --cached --quiet && exit 0
            git commit -qm "Preise $(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M')"
            git push && exit 0
            echo "Push abgelehnt – hole neuesten Stand und rufe erneut ab ($i)"
            git fetch -q origin main && git reset -q --hard origin/main
            python scripts/collect.py && python scripts/build_summary.py
          done
          exit 1
